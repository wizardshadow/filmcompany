<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Редактор — Infinity Frameworks</title><link rel="stylesheet" href="/cpanel.css"></head>
<body>
<main id="login"><form id="login-form"><div class="brand">INFINITY FRAMEWORKS</div><h1>Вход в редактор</h1><label>Логин<input name="username" autocomplete="username" required></label><label>Пароль<input name="password" type="password" autocomplete="current-password" required></label><button class="primary">Войти</button><p id="login-error" role="alert"></p></form></main>
<main id="editor" hidden>
<header><strong>INFINITY / РЕДАКТОР</strong><label class="sr">Страница<select id="page"><option value="home">Главная</option><option value="about">О нас</option><option value="contacts">Контакты</option><option value="brief">Бриф</option><option value="success">Успешная отправка</option></select></label><select id="viewport" aria-label="Ширина просмотра"><option value="100%">Компьютер</option><option value="768px">Планшет</option><option value="390px">Телефон</option></select><span id="status" role="status">Все изменения сохранены</span><button id="publish" class="primary" disabled>Сохранить на сайте</button><button id="logout">Выйти</button></header>
<div class="workspace"><div class="canvas"><iframe id="preview" title="Визуальный редактор сайта"></iframe></div><aside><h2 id="field-title">Выберите блок</h2><p id="hint">Наведите на текст, изображение или видео и нажмите на карандаш.</p><form id="field-form" hidden><label id="value-label">Содержимое<textarea id="value" rows="9"></textarea></label><label id="upload-label" hidden>Заменить файлом<input id="upload" type="file" accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm"><small>До 20 МБ</small></label><div class="actions"><button class="primary" type="submit">Применить</button><button id="cancel" type="button">Отменить</button></div><button id="reset" type="button">Вернуть исходное значение</button></form><p id="error" role="alert"></p><p class="note">«Применить» обновляет предпросмотр. «Сохранить на сайте» публикует изменения для посетителей.</p></aside></div>
</main><script src="/cpanel.js?v=3"></script></body></html>
